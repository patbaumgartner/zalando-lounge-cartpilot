version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10

  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/patchright"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
