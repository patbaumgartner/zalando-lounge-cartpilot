name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          mvn --batch-mode spring-boot:build-image \
            -Dspring-boot.build-image.imageName=${{ secrets.DOCKERHUB_USERNAME }}/zalando-lounge-cartpilot:${{ steps.version.outputs.VERSION }}

      - name: Tag as latest
        run: |
          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/zalando-lounge-cartpilot:${{ steps.version.outputs.VERSION }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/zalando-lounge-cartpilot:latest

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/zalando-lounge-cartpilot:${{ steps.version.outputs.VERSION }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/zalando-lounge-cartpilot:latest
