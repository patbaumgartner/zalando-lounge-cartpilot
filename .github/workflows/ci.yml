name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn --batch-mode verify

  publish-latest:
    name: Publish Latest Images
    runs-on: ubuntu-latest
    needs: test
    # Only publish on pushes to main; pull requests (incl. forks) have no secrets.
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push app image
        run: |
          mvn --batch-mode spring-boot:build-image \
            -Dspring-boot.build-image.imageName=${{ secrets.DOCKERHUB_USERNAME }}/zalando-lounge-cartpilot:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/zalando-lounge-cartpilot:latest

      - name: Build & push Patchright image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/zalando-lounge-cartpilot-patchright:latest \
            ./patchright
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/zalando-lounge-cartpilot-patchright:latest
