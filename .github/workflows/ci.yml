name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: "25"
  MAVEN_OPTS: "-Xmx1024m -XX:+UseG1GC"

jobs:
  # ── Java / Spring Boot ──────────────────────────────────────────────────────
  java:
    name: Java – Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Check code formatting
        run: ./mvnw spring-javaformat:validate -ntp

      - name: Build, test & verify
        # Integration tests use Testcontainers, which relies on the Docker daemon
        # available on the GitHub-hosted runner.
        run: ./mvnw clean verify -ntp -Dmaven.test.failure.ignore=true
        env:
          MAVEN_OPTS: ${{ env.MAVEN_OPTS }}

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: "Test Results – Java ${{ env.JAVA_VERSION }}"
          path: "target/surefire-reports/*.xml,target/failsafe-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: true

  # ── Publish :latest native image ────────────────────────────────────────────
  # Every push to main rebuilds the GraalVM native image and republishes it as
  # :latest, so the NAS can pull an up-to-date native container without cutting a
  # tagged release. Skipped on pull requests / forks, which have no secrets.
  publish-latest:
    name: Publish :latest native image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: java
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      # Native compilation needs more heap than the test job.
      MAVEN_OPTS: "-Xmx2048m -XX:+UseG1GC"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GraalVM native image (via the Paketo buildpack, BP_NATIVE_IMAGE=true in the
      # `native` profile) published straight to Docker Hub as :latest.
      - name: Build & publish :latest native image
        run: |
          ./mvnw -B -ntp -Pnative spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.publish=true \
            -Dspring-boot.build-image.imageName=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/zalando-lounge-cartpilot:latest
