services:

  cartpilot:
    image: ${CARTPILOT_IMAGE:-zalando-lounge-cartpilot:0.1.0-SNAPSHOT}
    container_name: cartpilot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      patchright:
        condition: service_started
    environment:
      # Activate the production profile: the base application.yml targets Postgres,
      # while the default (dev) profile forces the embedded H2 driver — leaving this
      # unset makes the H2 driver reject the Postgres SPRING_DATASOURCE_URL below.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cartpilot
      SPRING_DATASOURCE_USERNAME: cartpilot
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ZALANDO_EMAIL: ${ZALANDO_EMAIL}
      ZALANDO_PASSWORD: ${ZALANDO_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID}
      MAX_KEEP_ALIVE_HOURS: ${MAX_KEEP_ALIVE_HOURS:-2}
      # Daily scan trigger; override e.g. CARTPILOT_SCHEDULER_SCAN_CRON="0 5 * * * *" to run on demand.
      CARTPILOT_SCHEDULER_SCAN_CRON: ${CARTPILOT_SCHEDULER_SCAN_CRON:-0 0 6 * * *}
      # Use the undetected Patchright browser server (separate container).
      ZALANDO_BROWSER_WS_ENDPOINT: ws://patchright:3000/cartpilot
    volumes:
      - session_data:/workspace/session
    ports:
      # Loopback only: the actuator is unauthenticated and this app has no HTTP API.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  patchright:
    build: ./patchright
    container_name: cartpilot-patchright
    restart: unless-stopped
    # Patched, undetected Chromium server. Exposes a deterministic Playwright
    # endpoint at ws://patchright:3000/cartpilot for the cartpilot service.
    #
    # Loopback only: this endpoint drives a real browser that holds the logged-in
    # Zalando session, so anything that can reach it can act as the account. The
    # cartpilot service reaches it over the compose network, not this mapping.
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: cartpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartpilot
      POSTGRES_USER: cartpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  session_data:
