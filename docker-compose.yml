services:

  cartpilot:
    image: ${CARTPILOT_IMAGE:-zalando-lounge-cartpilot:0.1.0-SNAPSHOT}
    container_name: cartpilot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      patchright:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cartpilot
      SPRING_DATASOURCE_USERNAME: cartpilot
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ZALANDO_EMAIL: ${ZALANDO_EMAIL}
      ZALANDO_PASSWORD: ${ZALANDO_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID}
      MAX_KEEP_ALIVE_HOURS: ${MAX_KEEP_ALIVE_HOURS:-2}
      # Use the undetected Patchright browser server (separate container).
      ZALANDO_BROWSER_WS_ENDPOINT: ws://patchright:3000/cartpilot
    volumes:
      - session_data:/workspace/session
    ports:
      - "8080:8080"

  patchright:
    build: ./patchright
    container_name: cartpilot-patchright
    restart: unless-stopped
    # Patched, undetected Chromium server. Exposes a deterministic Playwright
    # endpoint at ws://patchright:3000/cartpilot for the cartpilot service.
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: cartpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartpilot
      POSTGRES_USER: cartpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  session_data:
